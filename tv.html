<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTV TV 播放端 V6 (自動遞補版)</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
    #player { position: absolute; inset: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
    
    #idleScreen { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at 50% 30%, rgba(255, 42, 95, 0.2), transparent 35%), linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; text-align: center; }
    #idleScreen h1 { margin: 0 0 15px; font-size: clamp(32px, 5vw, 80px); text-shadow: 0 0 30px rgba(255, 42, 95, 0.7); }
    #idleScreen p { margin: 0; color: #b2bec3; font-size: clamp(16px, 2vw, 30px); }
    
    #infoPanel { position: absolute; top: 30px; left: 30px; z-index: 20; display: flex; flex-direction: column; gap: 10px; max-width: 45vw; }
    .card { display: none; padding: 14px 20px; background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(12px); color: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); min-width: 280px; max-width: 45vw; }
    #nowPlaying { border-left: 5px solid #ff2a5f; }
    #nextSong { border-left: 5px solid #00e676; opacity: 0.92; }
    .label { margin-bottom: 5px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    #nowPlaying .label { color: #ff2a5f; }
    #nextSong .label { color: #00e676; }
    .title { font-size: clamp(16px, 1.5vw, 24px); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    #qrContainer { position: absolute; right: 40px; bottom: 40px; z-index: 30; display: none; flex-direction: column; align-items: center; padding: 15px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
    #qrCanvas { width: 180px; height: 180px; image-rendering: auto; }
    #qrText { margin-top: 10px; color: #111; font-weight: bold; font-size: 16px; letter-spacing: 1px; }
    
    #connectionStatus { position: absolute; right: 20px; top: 20px; z-index: 50; padding: 7px 12px; background: rgba(0, 0, 0, 0.7); border-radius: 20px; color: #00e676; font-size: 12px; }
  </style>
</head>
<body>

  <div id="idleScreen">
    <h1>🎤 頂級家庭 KTV</h1>
    <p id="idleMessage">系統連線中...</p>
  </div>

  <div id="infoPanel">
    <div id="nowPlaying" class="card">
      <div class="label">▶ 正在播放</div>
      <div class="title" id="nowPlayingTitle">載入中...</div>
    </div>
    <div id="nextSong" class="card">
      <div class="label">⏭ 下一首</div>
      <div class="title" id="nextSongTitle">無</div>
    </div>
  </div>

  <div id="qrContainer">
    <canvas id="qrCanvas" width="180" height="180"></canvas>
    <div id="qrText">掃描立即點歌</div>
  </div>

  <div id="connectionStatus">OFFLINE</div>
  <div id="player"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCBcNEQMbPobr00gzvEhYxeYmiuqXBmZF0",
      authDomain: "realtime-database-69288.firebaseapp.com",
      databaseURL: "https://realtime-database-69288-default-rtdb.firebaseio.com",
      projectId: "realtime-database-69288",
      storageBucket: "realtime-database-69288.firebasestorage.app",
      messagingSenderId: "757099420036",
      appId: "1:757099420036:web:4242dbf691bb93ec4de5d1",
      measurementId: "G-4LLZ5HYQ1C"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const TV_EMAIL = "tv@ktv.local";
    let player = null;
    let playerReady = false;
    let currentVideoId = null;
    let transitionBusy = false;
    let youtubeLoaded = false;
    let qrVisible = false;
    let transitionToken = null;

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value == null ? "" : String(value);
    }

    function showElement(id, displayValue) {
      const el = document.getElementById(id);
      if (el) el.style.display = displayValue;
    }

    async function loginTV() {
      const pwd = "14721472"; 
      try {
        await auth.signInWithEmailAndPassword(TV_EMAIL, pwd);
        setText("idleMessage", "TV 已連線，等待歌曲...");
        initTV();
      } catch (error) {
        console.error(error);
        setText("idleMessage", "登入失敗，請確認密碼");
        updateConnectionStatus("LOGIN FAILED");
      }
    }

    auth.onAuthStateChanged(user => {
      if (user && user.email === TV_EMAIL) {
        setText("idleMessage", "TV 已連線，等待歌曲...");
        initTV();
      } else {
        setText("idleMessage", "自動登入中...");
        loginTV();
      }
    });

    function loadYouTubeAPI() {
      if (youtubeLoaded) return;
      youtubeLoaded = true;
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(script);
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        width: "100%", height: "100%",
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, rel: 0, playsinline: 1, modestbranding: 1, hl: "zh-Hant" },
        events: {
          onReady: () => { playerReady = true; updateConnectionStatus("ONLINE"); recoverPlayback(); },
          onStateChange: onPlayerStateChange
        }
      });
    };

    function updateConnectionStatus(text) { setText("connectionStatus", text); }

    function initTV() {
      updateConnectionStatus("ONLINE");
      listenState();
      listenCommands();
      loadYouTubeAPI();
    }

    function listenState() {
      db.ref("ktv/state").on("value", snap => {
        const state = snap.val() || {};
        renderNowPlaying(state.nowPlaying || null);
        renderNextSong(state);

        // 🔥 關鍵修復：如果目前沒有在播放，但待播清單有歌，自動遞補播放第一首！
        if (!state.nowPlaying && playerReady) {
          playNextAtomic("auto-pull");
        }
      }, err => {
        console.error(err); updateConnectionStatus("DATABASE ERROR");
      });
    }

    function renderNowPlaying(song) {
      if (!song) {
        currentVideoId = null;
        showElement("nowPlaying", "none"); showElement("idleScreen", "flex");
        setText("idleMessage", "目前沒有歌曲，請使用手機點歌");
        if (playerReady && player && typeof player.stopVideo === "function") player.stopVideo();
        return;
      }
      showElement("idleScreen", "none"); showElement("nowPlaying", "block");
      setText("nowPlayingTitle", song.title);
      if (playerReady && player && currentVideoId !== song.videoId) {
        currentVideoId = song.videoId;
        player.loadVideoById(song.videoId);
      }
    }

    function renderNextSong(state) {
      const next = findNextSong(state);
      if (!next) return showElement("nextSong", "none");
      showElement("nextSong", "block");
      setText("nextSongTitle", next.song.title);
    }

    async function acquireTransitionLock() {
      const token = Math.random().toString(36).slice(2) + Date.now().toString(36);
      const now = Date.now();
      const lockRef = db.ref("ktv/transitionLock");
      const result = await lockRef.transaction(current => {
        if (current && current.lockedUntil && current.lockedUntil > now) return;
        return { token, lockedUntil: now + 10000 };
      }, undefined, false);

      if (!result.committed || !result.snapshot.exists()) return null;
      const lock = result.snapshot.val();
      if (lock.token !== token) return null;
      transitionToken = token;
      return token;
    }

    async function releaseTransitionLock() {
      if (!transitionToken) return;
      const token = transitionToken;
      transitionToken = null;
      const lockRef = db.ref("ktv/transitionLock");
      try {
        await lockRef.transaction(current => {
          if (current && current.token === token) return null;
          return current;
        }, undefined, false);
      } catch (error) { console.error(error); }
    }

    function findNextSong(state) {
      const priority = state.priority || {};
      const normal = state.normal || {};
      const prioritySongs = Object.keys(priority).map(key => ({ key, type: "priority", song: priority[key] })).sort((a, b) => a.song.timestamp - b.song.timestamp);
      if (prioritySongs.length > 0) return prioritySongs[0];

      const normalSongs = Object.keys(normal).map(key => ({ key, type: "normal", song: normal[key] })).sort((a, b) => a.song.timestamp - b.song.timestamp);
      if (normalSongs.length > 0) return normalSongs[0];
      return null;
    }

    async function playNextAtomic(reason) {
      if (transitionBusy) return;
      transitionBusy = true;
      try {
        const token = await acquireTransitionLock();
        if (!token) return;

        const stateSnapshot = await db.ref("ktv/state").once("value");
        const state = stateSnapshot.val() || {};
        if (state.nowPlaying) { await releaseTransitionLock(); return; }

        const next = findNextSong(state);
        const updates = {};
        if (next) {
          updates["ktv/state/nowPlaying"] = next.song;
          updates["ktv/state/" + next.type + "/" + next.key] = null;
        } else {
          updates["ktv/state/nowPlaying"] = null;
        }
        updates["ktv/transitionLock"] = null;
        await db.ref().update(updates);
        transitionToken = null;
      } catch (error) {
        console.error("playNextAtomic:", reason, error);
        await releaseTransitionLock();
      } finally {
        transitionBusy = false;
      }
    }

    async function cutSongAtomic(reason) {
      if (transitionBusy) return;
      transitionBusy = true;
      try {
        const token = await acquireTransitionLock();
        if (!token) return;

        const stateSnapshot = await db.ref("ktv/state").once("value");
        const state = stateSnapshot.val() || {};
        const current = state.nowPlaying;

        const next = findNextSong(state);
        const updates = {};
        
        if (current) {
          const historyKey = db.ref("ktv/history").push().key;
          updates["ktv/history/" + historyKey] = {
            videoId: current.videoId, title: current.title, playedAt: firebase.database.ServerValue.TIMESTAMP, uid: current.uid
          };
        }

        if (next) {
          updates["ktv/state/nowPlaying"] = next.song;
          updates["ktv/state/" + next.type + "/" + next.key] = null;
        } else {
          updates["ktv/state/nowPlaying"] = null;
        }
        updates["ktv/transitionLock"] = null;
        await db.ref().update(updates);
        transitionToken = null;
      } catch (error) {
        console.error("cutSongAtomic:", reason, error);
        await releaseTransitionLock();
      } finally {
        transitionBusy = false;
      }
    }

    async function recoverPlayback() {
      try {
        const snapshot = await db.ref("ktv/state").once("value");
        const state = snapshot.val() || {};
        if (state.nowPlaying) {
          currentVideoId = state.nowPlaying.videoId;
          player.loadVideoById(state.nowPlaying.videoId);
          return;
        }
        await playNextAtomic("startup");
      } catch (error) { console.error(error); }
    }

    function onPlayerStateChange(event) {
      if (event.data !== YT.PlayerState.ENDED) return;
      cutSongAtomic("youtube-ended");
    }

    function listenCommands() {
      db.ref("ktv/commands").on("child_added", async snap => {
        const command = snap.val();
        if (!command) return;
        try {
          await executeCommand(command.action);
        } catch (error) {
          console.error(error);
        } finally {
          await snap.ref.remove();
        }
      });
    }

    async function executeCommand(action) {
      if (!playerReady || !player) return;
      switch (action) {
        case "pause": player.pauseVideo(); break;
        case "play": player.playVideo(); break;
        case "next": await cutSongAtomic("remote-next"); break;
        case "toggleQR": toggleQR(); break;
        case "muteToggle": player.isMuted() ? player.unMute() : player.mute(); break;
        case "volUp": player.setVolume(Math.min(player.getVolume() + 10, 100)); break;
        case "volDown": player.setVolume(Math.max(player.getVolume() - 10, 0)); break;
      }
    }

    let qrLibraryLoaded = false;
    function loadQRLibrary(callback) {
      if (qrLibraryLoaded) return callback();
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
      script.onload = () => { qrLibraryLoaded = true; callback(); };
      document.head.appendChild(script);
    }

    function toggleQR() {
      qrVisible = !qrVisible;
      showElement("qrContainer", qrVisible ? "flex" : "none");
      if (qrVisible) drawQR();
    }

    function drawQR() {
      const canvas = document.getElementById("qrCanvas");
      canvas.style.display = "none";
      loadQRLibrary(() => {
        const temp = document.createElement("div");
        temp.style.position = "absolute"; temp.style.left = "-9999px";
        document.body.appendChild(temp);

        new QRCode(temp, {
          text: window.location.origin + "/mobile.html", width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M
        });

        setTimeout(() => {
          const image = temp.querySelector("img");
          if (image) {
            const context = canvas.getContext("2d");
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, 180, 180);
            canvas.style.display = "block";
          }
          temp.remove();
        }, 100);
      });
    }

    window.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" || e.key === "Enter") toggleQR();
      if (e.key === "Escape" && qrVisible) toggleQR();
    });
  </script>
</body>
</html>
