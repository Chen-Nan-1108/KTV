<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTV 電視播放端</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    /* ... 保持你原本的 CSS 樣式 ... */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
    #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
    #idleScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #302b63 0%, #0f0c29 70%); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; }
    #idleScreen h1 { font-size: 4vw; margin: 0 0 15px 0; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
    #idleScreen p { font-size: 1.5vw; color: #b2bec3; }
    #infoPanel { position: absolute; top: 20px; left: 20px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
    .card { padding: 8px 16px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); color: white; border-radius: 6px; min-width: 200px; max-width: 40vw; display: none; }
    #nowPlaying { border-left: 4px solid #ff2a5f; }
    #nextSong { border-left: 4px solid #00e676; }
    .label { font-size: 10px; font-weight: bold; color: #888; margin-bottom: 2px; text-transform: uppercase; }
    .title { font-size: 18px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #connectionStatus { position: absolute; right: 20px; top: 20px; z-index: 50; color: #00e676; font-size: 10px; opacity: 0.8; }
    #qrContainer { position: absolute; bottom: 40px; right: 40px; z-index: 100; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); display: none; flex-direction: column; align-items: center; }
    #qrContainer img { width: 150px; height: 150px; }
  </style>
</head>
<body>
  <div id="idleScreen"><h1>🎤 頂級家庭 KTV</h1><p id="idleMessage">系統連線中...</p></div>
  <div id="infoPanel">
    <div id="nowPlaying" class="card"><div class="label">▶ 正在播放</div><div class="title" id="nowPlayingTitle"></div></div>
    <div id="nextSong" class="card"><div class="label">⏭ 下一首</div><div class="title" id="nextSongTitle"></div></div>
  </div>
  <div id="connectionStatus">● CONNECTING</div>
  <div id="qrContainer"><img id="qrImg" src="" alt="QR"><div class="qr-text">掃描立即點歌</div></div>
  <div id="player"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCBcNEQMbPobr00gzvEhYxeYmiuqXBmZF0",
      authDomain: "realtime-database-69288.firebaseapp.com",
      databaseURL: "https://realtime-database-69288-default-rtdb.firebaseio.com",
      projectId: "realtime-database-69288",
      storageBucket: "realtime-database-69288.firebasestorage.app",
      messagingSenderId: "757099420036",
      appId: "1:757099420036:web:4242dbf691bb93ec4de5d1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // 🎯 最強乾淨歌名過濾
    function cleanSongTitle(title) {
      if (!title) return "未知歌曲";
      let t = String(title).trim();
      t = t.replace(/[\(\（\[［「『【\{〈《].*?[\)\）\]］」』】\}〉》]/g, " ");
      t = t.replace(/\/\/.*$/, "");
      const keywords = ["Official", "MV", "KTV", "伴奏", "動態歌詞", "繁體", "歌詞", "字幕", "高音質", "HD", "動畫", "主題曲", "專輯", "收錄在"];
      keywords.forEach(kw => t = t.replace(new RegExp(kw, "gi"), " "));
      return t.replace(/[-–—|/]+/g, " ").replace(/\s+/g, " ").trim();
    }

    // 直接寫死密碼，確保登入不報錯
    auth.signInWithEmailAndPassword("tv@ktv.local", "14721472").then(() => {
      document.getElementById("idleMessage").textContent = "TV 已連線，等待點歌...";
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(script);
    });

    let player;
    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player("player", { width: "100%", height: "100%", playerVars: { autoplay: 1, controls: 0 }, events: { onStateChange: e => { if(e.data === 0) db.ref("ktv/nowPlaying").remove(); } } });
      
      db.ref("ktv/nowPlaying").on("value", snap => {
        const data = snap.val();
        if(data) {
          document.getElementById("idleScreen").style.display = "none";
          document.getElementById("nowPlaying").style.display = "block";
          document.getElementById("nowPlayingTitle").textContent = cleanSongTitle(data.title);
          player.loadVideoById(data.videoId);
        } else {
          document.getElementById("idleScreen").style.display = "flex";
          document.getElementById("nowPlaying").style.display = "none";
        }
      });
    };

    window.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === "ArrowUp") {
        const qr = document.getElementById("qrContainer");
        qr.style.display = (qr.style.display === "flex" ? "none" : "flex");
        if(qr.style.display === "flex") document.getElementById("qrImg").src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + window.location.origin;
      }
    });
  </script>
</body>
</html>
