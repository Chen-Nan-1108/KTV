<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTV TV 播放端 (極簡版)</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #player { position: absolute; inset: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
    
    #infoPanel { position: absolute; top: 20px; left: 20px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
    .card { padding: 8px 16px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); color: white; border-radius: 6px; min-width: 200px; max-width: 40vw; display: none; }
    #nowPlaying { border-left: 4px solid #ff2a5f; }
    #nextSong { border-left: 4px solid #00e676; }
    .label { font-size: 10px; font-weight: bold; color: #888; margin-bottom: 2px; text-transform: uppercase; }
    .title { font-size: 18px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #connectionStatus { position: absolute; right: 20px; top: 20px; z-index: 50; color: #00e676; font-size: 10px; }
  </style>
</head>
<body>
  <div id="connectionStatus">ONLINE</div>
  <div id="infoPanel">
    <div id="nowPlaying" class="card"><div class="label">▶ 播放中</div><div class="title" id="nowPlayingTitle"></div></div>
    <div id="nextSong" class="card"><div class="label">⏭ 下一首</div><div class="title" id="nextSongTitle"></div></div>
  </div>
  <div id="player"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCBcNEQMbPobr00gzvEhYxeYmiuqXBmZF0",
      authDomain: "realtime-database-69288.firebaseapp.com",
      databaseURL: "https://realtime-database-69288-default-rtdb.firebaseio.com",
      projectId: "realtime-database-69288",
      storageBucket: "realtime-database-69288.firebasestorage.app",
      messagingSenderId: "757099420036",
      appId: "1:757099420036:web:4242dbf691bb93ec4de5d1",
      measurementId: "G-4LLZ5HYQ1C"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    let player, playerReady = false, currentVideoId = null;

    function cleanTitle(title) {
      return String(title || "")
        .replace(/【.*?】|\[.*?\]|\(.*?\)|（.*?）/g, "")
        .replace(/Official.*|MV|KTV|伴奏|動態歌詞|繁體|高音質|字幕|高清|畫質|HD|動畫|主題曲/gi, "")
        .replace(/-+/g, "-").trim();
    }

    auth.signInWithEmailAndPassword("tv@ktv.local", "14721472").then(() => {
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(script);
    });

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player("player", {
        width: "100%", height: "100%",
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, rel: 0 },
        events: {
          onReady: () => { playerReady = true; },
          onStateChange: (e) => { if (e.data === 0) cutSong(); }
        }
      });
      listenState();
    };

    function listenState() {
      db.ref("ktv/state").on("value", snap => {
        const state = snap.val() || {};
        const song = state.nowPlaying;
        
        // 更新顯示
        if (!song) {
          document.getElementById("nowPlaying").style.display = "none";
        } else {
          document.getElementById("nowPlaying").style.display = "block";
          document.getElementById("nowPlayingTitle").textContent = cleanTitle(song.title);
          if (playerReady && currentVideoId !== song.videoId) {
            currentVideoId = song.videoId;
            player.loadVideoById(song.videoId);
          }
        }

        // 下一首顯示
        const next = findNext(state);
        if (!next) {
          document.getElementById("nextSong").style.display = "none";
        } else {
          document.getElementById("nextSong").style.display = "block";
          document.getElementById("nextSongTitle").textContent = cleanTitle(next.song.title);
        }

        // 自動遞補
        if (!song && next) playNextAtomic();
      });
    }

    function findNext(state) {
      const p = state.priority || {}, n = state.normal || {};
      const list = [...Object.keys(p).map(k=>({key:k,type:'priority',song:p[k]})), ...Object.keys(n).map(k=>({key:k,type:'normal',song:n[k]}))];
      list.sort((a,b) => a.song.timestamp - b.song.timestamp);
      return list[0] || null;
    }

    async function playNextAtomic() {
      const state = (await db.ref("ktv/state").once("value")).val() || {};
      if (state.nowPlaying) return;
      const next = findNext(state);
      if (next) {
        await db.ref().update({
          ["ktv/state/nowPlaying"]: next.song,
          ["ktv/state/" + next.type + "/" + next.key]: null
        });
      }
    }

    async function cutSong() {
      const state = (await db.ref("ktv/state").once("value")).val() || {};
      const current = state.nowPlaying;
      if (current) {
        await db.ref("ktv/history").push({ ...current, playedAt: firebase.database.ServerValue.TIMESTAMP });
      }
      await db.ref("ktv/state/nowPlaying").set(null);
      playNextAtomic();
    }
  </script>
</body>
</html>
