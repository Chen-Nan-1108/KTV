<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTV</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
    #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
    #idleScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #302b63 0%, #0f0c29 70%); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; }
    #idleScreen h1 { font-size: 4vw; margin: 0 0 15px 0; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
    #idleScreen p { font-size: 1.5vw; color: #b2bec3; }
    #infoPanel { position: absolute; top: 20px; left: 20px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
    .card { padding: 8px 16px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); color: white; border-radius: 6px; min-width: 200px; max-width: 40vw; display: none; }
    #nowPlaying { border-left: 4px solid #ff2a5f; }
    #nextSong { border-left: 4px solid #00e676; }
    .label { font-size: 10px; font-weight: bold; color: #888; margin-bottom: 2px; text-transform: uppercase; }
    .title { font-size: 18px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #connectionStatus { position: absolute; right: 20px; top: 20px; z-index: 50; color: #00e676; font-size: 10px; opacity: 0.8; }
    
    #qrContainer { position: absolute; bottom: 40px; right: 40px; z-index: 100; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); display: none; flex-direction: column; align-items: center; }
    #qrContainer.show { display: flex !important; }
    #qrContainer img { width: 150px; height: 150px; display: block; }
    .qr-text { color: #000; font-weight: bold; margin-top: 10px; font-size: 16px; }
    
    #shortcutHint { position: absolute; bottom: 20px; left: 20px; z-index: 30; color: rgba(255, 255, 255, 0.35); font-size: 11px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="idleScreen"><h1>🎤 頂級家庭 KTV</h1><p id="idleMessage">系統連線中...</p></div>
  <div id="infoPanel">
    <div id="nowPlaying" class="card"><div class="label">▶ 正在播放</div><div class="title" id="nowPlayingTitle"></div></div>
    <div id="nextSong" class="card"><div class="label">⏭ 下一首</div><div class="title" id="nextSongTitle"></div></div>
  </div>
  <div id="connectionStatus">● CONNECTING</div>
  
  <div id="qrContainer">
    <img id="qrImg" src="" alt="QR Code">
    <div class="qr-text">掃描立即點歌</div>
  </div>

  <div id="player"></div>
  <div id="shortcutHint">ENTER / ↑ 顯示／隱藏 QR Code</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCBcNEQMbPobr00gzvEhYxeYmiuqXBmZF0",
      authDomain: "realtime-database-69288.firebaseapp.com",
      databaseURL: "https://realtime-database-69288-default-rtdb.firebaseio.com",
      projectId: "realtime-database-69288",
      storageBucket: "realtime-database-69288.firebasestorage.app",
      messagingSenderId: "757099420036",
      appId: "1:757099420036:web:4242dbf691bb93ec4de5d1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    function cleanSongTitle(title) {
      if (!title) return "未知歌曲";
      let t = String(title).trim();
      t = t.replace(/[\(\（\[［「『【\{〈《].*?[\)\）\]］」』】\}〉》]/g, " ");
      t = t.replace(/\/\/.*$/, "");
      const keywords = ["Official", "MV", "KTV", "伴奏", "動態歌詞", "繁體", "歌詞", "字幕", "高音質", "HD", "動畫", "主題曲", "專輯", "收錄在"];
      keywords.forEach(kw => t = t.replace(new RegExp(kw, "gi"), " "));
      return t.replace(/[-–—|/]+/g, " ").replace(/\s+/g, " ").trim();
    }

    auth.signInWithEmailAndPassword("tv@ktv.local", "14721472").then(() => {
      document.getElementById("connectionStatus").textContent = "● ONLINE";
      document.getElementById("idleMessage").textContent = "TV 已連線，等待點歌...";
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(script);
    }).catch(err => {
      console.error(err);
      document.getElementById("connectionStatus").textContent = "● LOGIN ERROR";
      document.getElementById("idleMessage").textContent = "登入失敗";
    });

    let player;
    let playerReady = false;
    let currentVideoId = null;

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player("player", {
        width: "100%", height: "100%",
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, rel: 0 },
        events: {
          onReady: () => { playerReady = true; checkAndPlayNext(); },
          onStateChange: e => { if (e.data === YT.PlayerState.ENDED) playNextSong(); }
        }
      });
      initListeners();
    };

    // QR Code 顯示與隱藏切換函式
    function toggleQR() {
      const qr = document.getElementById("qrContainer");
      qr.classList.toggle("show");
      if (qr.classList.contains("show")) {
        // 自動抓取主網址產生 QR Code
        const targetURL = window.location.origin + "/mobile.html";
        document.getElementById("qrImg").src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(targetURL);
      }
    }

    function initListeners() {
      db.ref("ktv/state").on("value", snap => {
        const state = snap.val() || {};
        const nowPlaying = state.nowPlaying;
        
        if (nowPlaying) {
          document.getElementById("idleScreen").style.display = "none";
          document.getElementById("nowPlaying").style.display = "block";
          document.getElementById("nowPlayingTitle").textContent = cleanSongTitle(nowPlaying.title);
          
          if (playerReady && player && currentVideoId !== nowPlaying.videoId) {
            currentVideoId = nowPlaying.videoId;
            player.loadVideoById(nowPlaying.videoId);
            player.playVideo();
          }
        } else {
          document.getElementById("idleScreen").style.display = "flex";
          document.getElementById("nowPlaying").style.display = "none";
          currentVideoId = null;
          if (playerReady && player && typeof player.stopVideo === "function") {
            player.stopVideo();
          }
          checkAndPlayNext();
        }

        const priority = Object.values(state.priority || {});
        const normal = Object.values(state.normal || {});
        priority.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        normal.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        
        const next = priority.length > 0 ? priority[0] : normal[0];
        if (next) {
          document.getElementById("nextSong").style.display = "block";
          document.getElementById("nextSongTitle").textContent = cleanSongTitle(next.title);
        } else {
          document.getElementById("nextSong").style.display = "none";
        }
      });
    }

    async function checkAndPlayNext() {
      if (!playerReady) return;
      const snap = await db.ref("ktv/state/nowPlaying").once("value");
      if (snap.exists()) return;

      const stateSnap = await db.ref("ktv/state").once("value");
      const state = stateSnap.val() || {};
      const priority = state.priority || {};
      const normal = state.normal || {};

      let targetKey = null;
      let targetType = null;
      let targetSong = null;

      const pKeys = Object.keys(priority);
      if (pKeys.length > 0) {
        targetKey = pKeys[0];
        targetType = "priority";
        targetSong = priority[targetKey];
      } else {
        const nKeys = Object.keys(normal);
        if (nKeys.length > 0) {
          targetKey = nKeys[0];
          targetType = "normal";
          targetSong = normal[targetKey];
        }
      }

      if (targetSong) {
        const updates = {};
        updates["ktv/state/nowPlaying"] = targetSong;
        updates[`ktv/state/${targetType}/${targetKey}`] = null;
        await db.ref().update(updates);
      }
    }

    async function playNextSong() {
      const nowSnap = await db.ref("ktv/state/nowPlaying").once("value");
      const current = nowSnap.val();
      if (current) {
        await db.ref("ktv/history").push({ ...current, playedAt: Date.now() });
      }
      if (playerReady && player) {
        player.stopVideo();
      }
      await db.ref("ktv/state/nowPlaying").remove();
      checkAndPlayNext();
    }

    // 監聽手機端傳來的遙控指令（包含 toggleQR、next、pause 等）
    db.ref("ktv/commands").on("child_added", async snap => {
      const cmd = snap.val();
      if (!cmd) { snap.ref.remove(); return; }
      
      if (cmd.action === "next") { playNextSong(); }
      else if (cmd.action === "pause" && playerReady && player) { player.pauseVideo(); }
      else if (cmd.action === "play" && playerReady && player) { player.playVideo(); }
      else if (cmd.action === "volUp" && playerReady && player) { player.setVolume(Math.min(player.getVolume() + 10, 100)); }
      else if (cmd.action === "volDown" && playerReady && player) { player.setVolume(Math.max(player.getVolume() - 10, 0)); }
      else if (cmd.action === "toggleQR") { toggleQR(); }
      
      snap.ref.remove();
    });

    // 鍵盤快捷鍵切換 QR Code
    window.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === "ArrowUp") {
        toggleQR();
      }
    });
  </script>
</body>
</html>
